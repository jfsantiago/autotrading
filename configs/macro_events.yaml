# Mantenido a mano. Actualizar cada pocos meses desde el calendario de la Fed
# (federalreserve.gov/monetarypolicy/fomccalendars.htm) y el calendario de CPI
# del BLS (bls.gov/schedule/news_release/cpi.htm). No existe una API gratuita
# confiable para esto. La Fed publica su calendario de reuniones casi un año
# completo por adelantado, así que no hace falta tocar este archivo seguido.
# Fecha de "decision" para FOMC = segundo día de la reunión (cuando se anuncia).
