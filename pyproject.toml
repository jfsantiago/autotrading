[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrading"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ccxt",
    "pandas",
    "python-dotenv",
    "pyyaml",
]

[project.scripts]
autotrading = "autotrading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
